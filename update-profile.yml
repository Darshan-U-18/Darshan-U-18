name: Update profile banner

on:
  schedule:
    - cron: "0 0 * * *"   # daily, so Up Time stays current
  workflow_dispatch:
  push:
    paths: [profile.json, portrait.txt, generate.py]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python generate.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark.svg light.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile banner"
          git push
